<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국 업종별 종목 지표 · 반도체</title>
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#14181f;--muted:#6b7380;--line:#e4e7ec;--accent:#2f5bea;
  --up:#d93a3a;--down:#2f6bd9;--chip:#eef1f6;--bar:#cfd9f7;--hover:#f1f4fb;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1218;--card:#171b23;--ink:#e8ebf0;--muted:#8d96a5;--line:#262c37;--accent:#7b9bff;
    --up:#ff6b6b;--down:#6aa0ff;--chip:#222836;--bar:#2a3a6b;--hover:#1d2330;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1218;--card:#171b23;--ink:#e8ebf0;--muted:#8d96a5;--line:#262c37;--accent:#7b9bff;
  --up:#ff6b6b;--down:#6aa0ff;--chip:#222836;--bar:#2a3a6b;--hover:#1d2330;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Pretendard","Malgun Gothic",system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;justify-content:space-between;margin-bottom:12px}
h1{font-size:22px;margin:0}
.meta{color:var(--muted);font-size:12px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
nav span{padding:6px 14px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap;font-size:13px}
nav span.on{background:var(--accent);color:#fff;font-weight:600}
nav span small{font-size:10px;opacity:.7;margin-left:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card .l{color:var(--muted);font-size:12px}
.card .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{border:0;background:var(--chip);color:var(--ink);padding:5px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);color:#fff}
input[type=search]{margin-left:auto;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;min-width:160px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:860px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
th.s::after{content:" ▲"}th.s.d::after{content:" ▼"}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
tbody tr:hover{background:var(--hover)}
.nm b{font-weight:600}.nm small{display:block;color:var(--muted);font-size:11px}
.up{color:var(--up)}.down{color:var(--down)}
.cap{position:relative}
.cap i{position:absolute;left:0;top:50%;height:60%;transform:translateY(-50%);background:var(--bar);z-index:0;border-radius:2px;opacity:.7}
.cap span{position:relative;z-index:1}
.na{color:var(--muted)}
.tag{font-size:11px;color:var(--muted);background:var(--chip);padding:1px 7px;border-radius:999px}
h2{font-size:15px;margin:0 0 8px}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--muted);font-size:11px}
.note{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.6}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;display:none;z-index:9;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>한국 업종별 종목 지표</h1>
    <div class="meta" id="meta"></div>
  </header>
  <nav id="nav"></nav>

  <div class="panel" id="overview" hidden>
    <h2>업종 비교 <span class="tag">중앙값 기준 · 행 클릭 시 업종 이동</span></h2>
    <div class="tw"><table id="ovt"></table></div>
  </div>

  <div id="detail">
  <div class="cards" id="cards"></div>

  <div class="panel">
    <h2>ROE vs PER <span class="tag">원 크기 = 시가총액</span></h2>
    <div id="chart"></div>
  </div>

  <div class="panel">
    <div class="tools" id="tools"></div>
    <div class="tw"><table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table></div>
    <div class="note">
      PER = 현재가 ÷ 최근 확정 EPS · Forward P/E = 증권사 컨센서스 추정 EPS 기준(추정치 없는 종목은 '-') · ROE(확정) = 최근 확정 연간 실적, ROE(추정) = 컨센서스 올해 예상.<br>
      적자 종목의 PER은 '-'로 표시. 시가총액 단위는 조/억원. 가격: <span id="src"></span> · 재무: <span id="src2"></span>. 투자 판단의 근거가 아닌 참고용 정보입니다.
    </div>
  </div>
  </div>
</div>
<div id="tip"></div>
<script src="data.js"></script>
<script>
const D = window.ALL_DATA, KEYS = Object.keys(D.sectors);
let cur = KEYS[0], S = [];
const $ = id => document.getElementById(id);
const fmt = (v, d = 1) => v == null ? null : v.toLocaleString('ko-KR', {minimumFractionDigits: d, maximumFractionDigits: d});
const cell = (v, d = 1, suf = '') => v == null ? '<span class="na">-</span>' : fmt(v, d) + suf;
const capTxt = v => v == null ? '-' : v >= 10000 ? fmt(v / 10000, 1) + '조' : fmt(v, 0) + '억';
const median = a => { a = a.filter(x => x != null).sort((x, y) => x - y); if (!a.length) return null; const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };

$('meta').textContent = `업데이트 ${D.updated}`;
$('src').textContent = D.priceSource;
$('src2').textContent = D.fundamentalSource;

const COLS = [
  ['name', '종목', 0], ['sub', '세부업종', 0],
  ['price', '현재가(원)', 0], ['changePct', '등락률', 2], ['marketCap', '시가총액', 0],
  ['per', 'PER(배)', 1], ['fper', 'Fwd P/E(배)', 1],
  ['roe', 'ROE 확정(%)', 1], ['roeF', 'ROE 추정(%)', 1], ['pbr', 'PBR(배)', 2]
];
let sortKey = 'marketCap', sortDir = -1, sub = '전체', q = '';

function renderCards() {
  const tot = S.reduce((a, s) => a + (s.marketCap || 0), 0);
  const items = [
    ['종목 수', S.length + '개'],
    ['시가총액 합계', capTxt(tot)],
    ['PER 중앙값', cell(median(S.map(s => s.per)), 1, '배')],
    ['Fwd P/E 중앙값', cell(median(S.map(s => s.fper)), 1, '배')],
    ['ROE(확정) 중앙값', cell(median(S.map(s => s.roe)), 1, '%')],
  ];
  $('cards').innerHTML = items.map(([l, v]) => `<div class="card"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('');
}

function renderTools() {
  const subs = ['전체', ...new Set(S.map(s => s.sub))];
  $('tools').innerHTML = subs.map(x => `<button class="chip${x === sub ? ' on' : ''}" data-s="${x}">${x}</button>`).join('')
    + `<input type="search" id="q" placeholder="종목명·코드 검색" value="${q}">`;
  $('tools').querySelectorAll('.chip').forEach(b => b.onclick = () => { sub = b.dataset.s; renderTools(); renderTable(); });
  $('q').oninput = e => { q = e.target.value.trim(); renderTable(); };
  $('q').onfocus = e => { const l = e.target.value.length; e.target.setSelectionRange(l, l); };
  if (q) $('q').focus();
}

function renderHead() {
  $('head').innerHTML = COLS.map(([k, t]) =>
    `<th data-k="${k}" class="${k === sortKey ? 's' + (sortDir > 0 ? '' : ' d') : ''}">${t}</th>`).join('');
  $('head').querySelectorAll('th').forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = (k === 'name' || k === 'sub') ? 1 : -1; }
    renderHead(); renderTable();
  });
}

function rows() {
  const t = q.toLowerCase();
  return S.filter(s => (sub === '전체' || s.sub === sub) && (!t || s.name.toLowerCase().includes(t) || s.code.includes(t)))
    .sort((a, b) => {
      const x = a[sortKey], y = b[sortKey];
      if (x == null && y == null) return 0;
      if (x == null) return 1; if (y == null) return -1;   // 결측은 항상 아래로
      return (typeof x === 'string' ? x.localeCompare(y, 'ko') : x - y) * sortDir;
    });
}

function renderTable() {
  const r = rows(), mx = Math.max(...S.map(s => s.marketCap || 0));
  $('body').innerHTML = r.map(s => {
    const c = s.changePct > 0 ? 'up' : s.changePct < 0 ? 'down' : '';
    const sign = s.changePct > 0 ? '+' : '';
    return `<tr>
      <td class="nm"><b>${s.name}</b><small>${s.code} · ${s.market}</small></td>
      <td><span class="tag">${s.sub}</span></td>
      <td>${cell(s.price, 0)}</td>
      <td class="${c}">${s.changePct == null ? '-' : sign + fmt(s.changePct, 2) + '%'}</td>
      <td class="cap"><i style="width:${(s.marketCap / mx * 100).toFixed(1)}%"></i><span>${capTxt(s.marketCap)}</span></td>
      <td>${cell(s.per)}</td><td>${cell(s.fper)}</td>
      <td>${cell(s.roe)}</td><td>${cell(s.roeF)}</td><td>${cell(s.pbr, 2)}</td></tr>`;
  }).join('') || '<tr><td colspan="10" class="na" style="text-align:center">결과 없음</td></tr>';
  renderChart(r);
}

function renderChart(r) {
  const W = 760, H = 340, m = {l: 44, r: 16, t: 12, b: 34};
  const pts = r.filter(s => s.per != null && s.roe != null);
  const xs = pts.map(s => s.roe), xMin = Math.min(-5, ...xs), xMax = Math.max(50, ...xs) * 1.03;
  const yMax = 100;
  const X = v => m.l + (v - xMin) / (xMax - xMin) * (W - m.l - m.r);
  const Y = v => H - m.b - Math.min(v, yMax) / yMax * (H - m.t - m.b);
  const mxCap = Math.max(...S.map(s => s.marketCap || 1));
  let g = '';
  for (let v = 0; v <= yMax; v += 20) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  for (let v = Math.ceil(xMin / 10) * 10; v <= xMax; v += 10) g += `<text x="${X(v)}" y="${H - m.b + 16}" text-anchor="middle">${v}%</text>`;
  g += `<text x="${m.l}" y="10">PER(배)</text><text x="${W - m.r}" y="${H - 4}" text-anchor="end">ROE(확정, %)</text>`;
  g += pts.map(s => {
    const rad = 4 + Math.sqrt(s.marketCap / mxCap) * 22;
    const clip = s.per > yMax ? '↑' : '';
    return `<g data-i="${s.code}"><circle cx="${X(s.roe)}" cy="${Y(s.per)}" r="${rad.toFixed(1)}" fill="var(--accent)" fill-opacity=".35" stroke="var(--accent)"/>`
      + (rad > 9 || pts.length < 15 ? `<text x="${X(s.roe)}" y="${Y(s.per) - rad - 3}" text-anchor="middle" style="fill:var(--ink)">${s.name}${clip}</text>` : '') + '</g>';
  }).join('');
  $('chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ROE 대비 PER 산점도">${g}</svg>`;
  const tip = $('tip');
  $('chart').querySelectorAll('g[data-i]').forEach(el => {
    const s = S.find(x => x.code === el.dataset.i);
    el.onmousemove = e => { tip.style.display = 'block'; tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY + 12 + 'px';
      tip.innerHTML = `<b>${s.name}</b> · 시총 ${capTxt(s.marketCap)}<br>PER ${fmt(s.per)} · Fwd ${fmt(s.fper) ?? '-'} · ROE ${fmt(s.roe)}%`; };
    el.onmouseleave = () => tip.style.display = 'none';
  });
}

function renderNav() {
  $('nav').innerHTML = [['all', '업종 비교'], ...KEYS.map(k => [k, D.sectors[k].name])]
    .map(([k, n]) => `<span data-k="${k}" class="${k === cur ? 'on' : ''}" style="cursor:pointer">${n}</span>`).join('');
  $('nav').querySelectorAll('span').forEach(el => el.onclick = () => { location.hash = el.dataset.k; });
}

function renderOverview() {
  const head = ['업종', '종목 수', '시총 합계', '등락률 중앙값', 'PER 중앙값', 'Fwd P/E 중앙값', 'ROE(확정) 중앙값', 'ROE(추정) 중앙값'];
  const body = KEYS.map(k => {
    const st = D.sectors[k].stocks, md = f => median(st.map(s => s[f]));
    const cp = md('changePct');
    return `<tr data-k="${k}" style="cursor:pointer"><td><b>${D.sectors[k].name}</b></td><td>${st.length}</td>
      <td>${capTxt(st.reduce((a, s) => a + (s.marketCap || 0), 0))}</td>
      <td class="${cp > 0 ? 'up' : cp < 0 ? 'down' : ''}">${cp == null ? '-' : (cp > 0 ? '+' : '') + fmt(cp, 2) + '%'}</td>
      <td>${cell(md('per'))}</td><td>${cell(md('fper'))}</td><td>${cell(md('roe'))}</td><td>${cell(md('roeF'))}</td></tr>`;
  }).join('');
  $('ovt').innerHTML = `<thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody>`;
  $('ovt').querySelectorAll('tr[data-k]').forEach(tr => tr.onclick = () => { location.hash = tr.dataset.k; });
}

function route() {
  const h = location.hash.slice(1);
  cur = h === 'all' || KEYS.includes(h) ? h : 'all';
  renderNav();
  $('overview').hidden = cur !== 'all';
  $('detail').hidden = cur === 'all';
  document.title = `한국 업종별 종목 지표 · ${cur === 'all' ? '업종 비교' : D.sectors[cur].name}`;
  if (cur === 'all') return renderOverview();
  S = D.sectors[cur].stocks; sub = '전체'; q = '';
  sortKey = 'marketCap'; sortDir = -1;
  renderCards(); renderTools(); renderHead(); renderTable();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
