name: Deploy to GitHub Pages

# 로컬 PC에서 update.ps1이 data.js를 커밋·푸시하면 자동 배포된다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# 업로드 직후에는 artifact가 조회되지 않는 GitHub 버그가 있어(actions/deploy-pages#451)
# 업로드/배포 job을 분리하고, 대기 후 배포하며 실패하면 한 번 더 시도한다.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html data.js _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - name: Wait for artifact listing
        run: sleep 30
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
